name: Build Brioche

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: brioche-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS 12 ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned macOS-compatible Python
        run: python3 scripts/setup_macos_python.py --arch ${{ matrix.arch }} --directory "$RUNNER_TEMP/compat-python"
      - name: Isolate Python environment
        run: |
          python3 -c "import sys; assert sys.version_info[:3] == (3, 11, 18), sys.version"
          python3 -m venv "$RUNNER_TEMP/brioche-python"
          echo "$RUNNER_TEMP/brioche-python/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.26.11'
          cache-dependency-path: network-helper/go.macos12.sum
      - name: Install application dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel packaging
          python3 scripts/install_macos_deps.py --wheelhouse "$RUNNER_TEMP/macos12-wheels"
      - name: Test and build compatible network module
        run: python3 scripts/build_network.py
      - name: Test and build native Rust streaming core
        run: python3 scripts/build_core.py --test
      - name: Test portable source and file transfer
        run: python3 -m unittest discover -s tests -v
      - name: Build native application bundle
        run: python3 scripts/build.py
      - name: Audit every native binary against macOS 12
        run: python3 scripts/check_macos.py dist/Brioche.app --arch ${{ matrix.arch }} --output artifacts/macos12-audit.json
      - name: Check bundled runtime without screen or input permission prompts
        run: |
          dist/Brioche.app/Contents/MacOS/Brioche self-test --output artifacts/bundle-runtime.json
          python3 -c "import json; r=json.load(open('artifacts/bundle-runtime.json')); print(r); assert r['pass']"
      - name: Package app, notices and checksums
        run: |
          python3 scripts/package_macos.py
          python3 scripts/package_source.py
          python3 scripts/checksums.py releases
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Brioche-macOS12-${{ matrix.arch }}
          path: |
            releases/*.zip
            releases/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Reports-macOS12-${{ matrix.arch }}
          path: |
            artifacts/macos12-audit.json
            artifacts/bundle-runtime.json
          if-no-files-found: ignore

  media:
    name: Media ${{ matrix.platform }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Ubuntu
            target: linux
          - platform: Windows
            target: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check unchanged media recipe
        id: media-key
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          unchanged = hashlib.sha256(Path('scripts/build_media.py').read_bytes()).hexdigest() == 'd0d25f5e5203c3f7534a4cc1f12f141a7ef678dd1083b41f860df82e0cc4b07d'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('unchanged=' + str(unchanged).lower() + '\n')
          PY
      - name: Reuse verified identical media build
        id: cached-media
        if: steps.media-key.outputs.unchanged == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: media-${{ matrix.platform }}
          run-id: 44660747066
          github-token: ${{ github.token }}
          path: .
      - name: Install media build tools
        if: steps.cached-media.outcome != 'success'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm libxcb1-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-shape0-dev gcc-mingw-w64-x86-64
      - name: Build minimal capture and NVENC component
        if: steps.cached-media.outcome != 'success'
        run: python3 scripts/build_media.py --platform ${{ matrix.target }} --work-dir "$RUNNER_TEMP/media-build" --source-archive releases/Brioche-media-sources-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: media-${{ matrix.platform }}
          path: |
            runtime/media/**
            releases/Brioche-media-sources-*.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload media configure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: media-config-${{ matrix.platform }}
          path: ${{ runner.temp }}/media-build/build-${{ matrix.target }}/ffbuild/config.log
          if-no-files-found: ignore

  build:
    needs: media
    name: ${{ matrix.platform }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows
          - os: ubuntu-22.04
            platform: Ubuntu
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Download media component and corresponding source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: media-${{ matrix.platform }}
          path: .
      - name: Restore Linux executable permission
        if: runner.os == 'Linux'
        run: chmod +x runtime/media/ffmpeg
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: network-helper/go.mod
          cache-dependency-path: network-helper/go.sum
      - name: Install Linux desktop test libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libopengl0 libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-randr0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller==6.11.1
      - name: Test source on Linux isolated desktop
        if: runner.os == 'Linux'
        run: python scripts/check_linux.py --source-only
      - name: Test portable source on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Test and build embedded Tailscale
        run: python scripts/build_network.py
      - name: Test and build native Rust streaming core
        run: python scripts/build_core.py --test
      - name: Build application
        run: python scripts/build.py
      - name: Check packaged runtime
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            dist/Brioche/Brioche.exe self-test --output artifacts/bundle-runtime.json
          else
            dist/Brioche/Brioche self-test --output artifacts/bundle-runtime.json
          fi
          python -c "import json; r=json.load(open('artifacts/bundle-runtime.json', encoding='utf-8')); print(json.dumps(r, indent=2)); assert r['pass']"
      - name: Test Linux packaged remote desktop
        if: runner.os == 'Linux'
        run: python scripts/check_linux.py --binary-only
      - name: Package Windows portable EXE folder
        if: runner.os == 'Windows'
        run: python scripts/package_windows.py
      - name: Package Ubuntu DEB
        if: runner.os == 'Linux'
        run: python scripts/package_linux.py
      - name: Package source and checksums
        run: |
          python scripts/package_source.py
          python scripts/checksums.py releases
      - name: Upload downloadable packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Brioche-${{ matrix.platform }}-x64
          path: |
            releases/*.zip
            releases/*.deb
            releases/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Reports-${{ matrix.platform }}-x64
          path: |
            artifacts/tests.txt
            artifacts/gui-smoke.txt
            artifacts/bundle-smoke.txt
            artifacts/bundle-runtime.json
          if-no-files-found: ignore
          retention-days: 14
