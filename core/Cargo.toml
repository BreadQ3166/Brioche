[workspace]
resolver = "2"
members = [
    "crates/brioche-proto",
    "crates/brioche-transport",
    "crates/brioche-capture",
    "crates/brioche-codec",
    "crates/brioche-render",
    "crates/brioche-daemon",
]

[workspace.package]
version = "2.0.0-alpha.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bytemuck = { version = "1.18", features = ["derive"] }
chacha20poly1305 = "0.10"
pollster = "0.3"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = "0.5"
thiserror = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process"] }
wgpu = "22"
